<header>
  <div class="btns">
    @for (item of headerData; track item.language) {
      <div class="btnsDiv">
        <button
          type="button"
          (click)="language.changeLanguage(item.language)"
          [class.active]="language.selectedLanguage() === item.language"
          class="headerBtn"
        >
          {{ item.key | translate }}
        </button>

        @if (version.selectedVersion() === 'abo') {
          <details [open]="isOpen">
            <summary [class.active]="isOpen" (click)="toggleAll($event)">
              @if (isOpen) {
                <span>{{ 'CLOSE' | translate }}</span>
              } @else {
                <span>{{ 'OPEN' | translate }}</span>
              }
            </summary>

            <p>{{ item.content | translate }}</p>
          </details>
        }
      </div>
    }
  </div>
</header>
