<div class="bodyTopHeader">
  <button
    (click)="version.versionStatus('abo')"
    [class.active]="version.selectedVersion() === 'abo'"
  >
    Abo Version
  </button>
  <button
    (click)="version.versionStatus('free')"
    [class.active]="version.selectedVersion() === 'free'"
  >
    Free Version
  </button>
</div>
